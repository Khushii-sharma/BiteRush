{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="{% static 'delivery/images/logo.png' %}">
    <title>BiteRush - Sign Up</title>
    <link rel="stylesheet" href="{% static 'delivery/css/signup.css' %}">
</head>
<body>

    <div class="signup-card">
        <h1 class="brand-title">BiteRush</h1>
        <p class="subtitle">Create an account to start ordering</p>

        <form action="{% url 'signup' %}" method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" name="username" id="username" placeholder="Choose a username" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" name="password" id="password" placeholder="Create a strong password" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" name="email" id="email" placeholder="name@example.com" required>
            </div>

            <div class="form-group">
                <label for="mobile">Mobile</label>
                <input type="text" name="mobile" id="mobile" placeholder="Enter mobile number">
            </div>

            <div class="form-group">
                <label for="address">Address</label>
                <textarea name="address" id="address" placeholder="Enter address"></textarea>
            </div>

            <button type="submit" class="btn-signup">Create Account</button>
        </form>

        <p class="login-link">
            Already an user? <a href="open_login">Login</a>
        </p>
    </div>

</body>
</html>
