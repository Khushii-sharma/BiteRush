{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="{% static 'delivery/images/logo.png' %}">
    <title>BiteRush - Update Restaurant</title>
    <link rel="stylesheet" href="{% static 'delivery/css/update_restaurant.css' %}">
</head>
<body>
    <div class="form-card">
        <h1 class="brand-title">BiteRush</h1>
        <p class="subtitle">Update Restaurant Details</p>

        <form action="{% url 'update_restaurant' restaurant.id %}" method="post">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="name">Restaurant Name</label>
                <input type="text" name="name" id="name" value="{{ restaurant.name }}" required>
            </div>

            <div class="form-group">
                <label for="picture">Picture URL</label>
                <input type="text" name="picture" id="picture" value="{{ restaurant.picture }}" required>
            </div>

            <div class="form-group">
                <label for="cuisine">Cuisine Type</label>
                <input type="text" name="cuisine" id="cuisine" value="{{ restaurant.cuisine }}" required>
            </div>

            <div class="form-group">
                <label for="rating">Rating (0 - 5)</label>
                <input type="number" name="rating" id="rating" min="0" max="5" step="0.1" value="{{ restaurant.rating }}" required>
            </div>

            <button type="submit" class="btn-submit">Save Changes</button>
        </form>
    </div>
</body>
</html>
