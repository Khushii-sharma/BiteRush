{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="{% static 'delivery/images/logo.png' %}">
    <title>BiteRush - Add Restaurant</title>
    <link rel="stylesheet" href="{% static 'delivery/css/add_restaurant.css' %}">
</head>
<body>
    <div class="form-card">
        <h1 class="brand-title">BiteRush</h1>
        <p class="subtitle">Add a New Restaurant</p>

        <form action="{% url 'add_restaurant' %}" method="post">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="name">Restaurant Name</label>
                <input type="text" name="name" id="name" placeholder="e.g. Pizza Palace" required>
            </div>

            <div class="form-group">
                <label for="picture">Picture URL</label>
                <input type="text" name="picture" id="picture" placeholder="https://example.com/image.jpg" required>
            </div>

            <div class="form-group">
                <label for="cuisine">Cuisine Type</label>
                <input type="text" name="cuisine" id="cuisine" placeholder="e.g. Italian, Chinese, Fast Food" required>
            </div>

            <div class="form-group">
                <label for="rating">Rating (0 - 5)</label>
                <input type="number" name="rating" id="rating" min="0" max="5" step="0.1" placeholder="4.5" required>
            </div>

            <button type="submit" class="btn-submit">Add Restaurant</button>
        </form>
    </div>
</body>
</html>
